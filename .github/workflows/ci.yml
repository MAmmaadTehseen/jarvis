name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Without this the DynamoDB integration test skips itself and the single-table
    # layout goes untested.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8001:8000

    env:
      DYNAMODB_ENDPOINT: http://localhost:8001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Docker build
        run: docker build -t jarvis:ci .
